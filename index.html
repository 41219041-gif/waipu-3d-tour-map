<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外埔區 3D 地理導覽｜資料驗證版</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:#10261d;color:#fff}#map{position:absolute;inset:0}.panel{position:absolute;z-index:3;top:18px;left:18px;width:min(360px,calc(100vw - 36px));background:#10251ee8;border:1px solid #ffffff38;border-radius:18px;padding:18px;box-shadow:0 12px 40px #0005;backdrop-filter:blur(12px)}h1{font-size:21px;margin:0 0 7px}.sub{font-size:12px;color:#d5e9d9;line-height:1.7}.pill{display:inline-block;background:#d9f2dc;color:#164e33;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;margin-bottom:10px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{border:1px solid #b8d8c3;background:#244e3b;color:white;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}button:hover{background:#3b7356}.status{font-size:12px;margin-top:12px;line-height:1.7;color:#f9e6ac}.legend{position:absolute;bottom:25px;left:18px;background:#10251ee8;border-radius:12px;padding:12px;font-size:12px;line-height:1.8;z-index:3}.note{position:absolute;right:14px;bottom:28px;max-width:240px;font-size:11px;background:#10251edb;padding:10px;border-radius:10px;z-index:3}.maplibregl-ctrl-top-right{top:15px;right:12px}@media(max-width:600px){.panel{top:10px;left:10px;padding:13px;width:calc(100vw - 20px)}h1{font-size:18px}.legend{bottom:12px;left:10px}.note{display:none}}</style></head><body><div id="map"></div><div class="panel"><span class="pill">V1 · 真實地理資料優先</span><h1>台中外埔 3D 導覽地圖</h1><div class="sub">以神跡埔桃酒造為中心 · 約 2 公里半徑<br>真實 OSM 底圖｜道路與建築輪廓｜45° 斜角鳥瞰</div><div class="buttons"><button id="locate">定位酒造</button><button id="bird">45° 鳥瞰</button><button id="north">正北俯視</button><button id="reload">重新取得圖資</button></div><div class="status" id="status">正在尋找酒造位置並讀取公開圖資……</div></div><div class="legend">🟠 酒造中心（經地址查詢）<br>🟢 建築 3D：OSM 輪廓／高度估算<br>🔵 圓形：2 公里研究範圍<br>⚠️ 未查證景點不任意標示</div><div class="note">本版是可操作的地理資料原型，尚未匯入政府 DEM、衛星地物分類與高鐵專用測繪資料。OSM 圖資須連網載入。</div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const statusEl=document.getElementById('status');const setStatus=t=>statusEl.textContent=t;
// Initial location is a broad, explicitly provisional Waipu-area viewport, NOT a claimed address coordinate.
let center=[120.66,24.32],verified=false;let marker;
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center,zoom:12.8,pitch:45,bearing:0,antialias:true});map.addControl(new maplibregl.NavigationControl(),'top-right');map.addControl(new maplibregl.ScaleControl({unit:'metric'}));
function circle(lon,lat,r=2000){const coords=[];for(let i=0;i<=128;i++){let a=2*Math.PI*i/128;coords.push([lon+(r*Math.cos(a))/(111320*Math.cos(lat*Math.PI/180)),lat+(r*Math.sin(a))/111320]);}return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{}};}
function updateCenter(){if(marker)marker.remove();marker=new maplibregl.Marker({color:'#ff872f'}).setLngLat(center).setPopup(new maplibregl.Popup().setHTML('<strong>神跡埔桃酒造</strong><br>水頭二路10號<br>'+ (verified?'位置：公開地理編碼結果':'位置：尚未核實'))).addTo(map);let d={type:'FeatureCollection',features:[circle(...center)]};if(map.getSource('radius'))map.getSource('radius').setData(d);else {map.addSource('radius',{type:'geojson',data:d});map.addLayer({id:'radius-fill',type:'fill',source:'radius',paint:{'fill-color':'#28a7db','fill-opacity':0.07}});map.addLayer({id:'radius-line',type:'line',source:'radius',paint:{'line-color':'#0a9fd1','line-width':3,'line-dasharray':[2,2]}})}map.flyTo({center,zoom:13.5,pitch:45,bearing:0,duration:1300});}
async function geocode(){let q='臺中市外埔區水頭二路10號 神跡埔桃酒造';try{let res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q));let a=await res.json();if(!a.length){res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent('神跡埔桃酒造 台中'));a=await res.json()}if(a.length){center=[+a[0].lon,+a[0].lat];verified=true;setStatus('已取得公開地理編碼位置；仍需與政府地籍及衛星圖比對。正在載入 OSM 建築……');}else setStatus('找不到酒造的可靠地理編碼結果；目前僅顯示外埔區概略視角，中心位置待確認。');}catch(e){setStatus('地址查詢暫時失敗；中心位置待確認，請連網重試。')}updateCenter();if(verified)loadOSM();}
async function loadOSM(){let [lon,lat]=center;let d=2000;let s=lat-d/111320,n=lat+d/111320,w=lon-d/(111320*Math.cos(lat*Math.PI/180)),e=lon+d/(111320*Math.cos(lat*Math.PI/180));let query=`[out:json][timeout:35];(way["building"](${s},${w},${n},${e}););out geom;`;try{let response=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});if(!response.ok)throw Error('HTTP '+response.status);let json=await response.json();let features=json.elements.filter(x=>x.type==='way'&&x.geometry?.length>=4).map(x=>{let ring=x.geometry.map(p=>[p.lon,p.lat]);if(JSON.stringify(ring[0])!==JSON.stringify(ring.at(-1)))ring.push(ring[0]);return {type:'Feature',properties:{height:x.tags?.height?parseFloat(x.tags.height):x.tags?.['building:levels']?Number(x.tags['building:levels'])*3:6,estimated:!x.tags?.height&&!x.tags?.['building:levels']},geometry:{type:'Polygon',coordinates:[ring]}}});let geo={type:'FeatureCollection',features};if(map.getSource('buildings'))map.getSource('buildings').setData(geo);else{map.addSource('buildings',{type:'geojson',data:geo});map.addLayer({id:'building-3d',type:'fill-extrusion',source:'buildings',paint:{'fill-extrusion-color':'#c7b79a','fill-extrusion-height':['get','height'],'fill-extrusion-base':0,'fill-extrusion-opacity':0.8}})}setStatus(`已載入 ${features.length} 個 OSM 建築輪廓。未提供高度者暫以 6 公尺示意；DEM、農地分類與高鐵結構仍待驗證。`)}catch(e){setStatus('OSM 建築資料暫時無法載入（'+e.message+'）。底圖仍可使用；請稍後按「重新取得圖資」。')}}
map.on('load',geocode);document.getElementById('locate').onclick=()=>map.flyTo({center,zoom:14.2,pitch:50,bearing:0});document.getElementById('bird').onclick=()=>map.easeTo({pitch:45,bearing:0,duration:700});document.getElementById('north').onclick=()=>map.easeTo({pitch:0,bearing:0,duration:700});document.getElementById('reload').onclick=()=>verified?loadOSM():geocode();
</script></body></html>
